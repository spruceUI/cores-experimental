name: Build one core variant

# Ad-hoc counterpart to _build-one-core.yml, which is bound to an immutable
# release plan. This one takes the three axes directly so a single core can be
# built for one chipset at one optimization level without a release candidate.
#
# A chipset selection narrows the build to that chipset's architecture, because
# a typed tuning profile is architecture-bound; within that architecture the
# core's complete declared target set is built.

on:
  workflow_dispatch:
    inputs:
      core_id:
        description: Catalog core to build
        required: true
        type: string
      chipset:
        description: Chipset whose typed tuning profile selects the machine flags
        required: true
        type: choice
        options:
          - universal
          - a133p
          - a33
          - a523
          - h700
          - rk3326
          - rk3566
          - ssd202d
      track_tag:
        description: Track and stability half of the group tag
        required: true
        default: main-stable
        type: choice
        options:
          - main-stable
          - main-test
          - nightly-stable
          - nightly-test
          - edge-stable
          - edge-test
      optimization_profile:
        description: >-
          Typed optimization profile. release-v1 contributes nothing; the
          others require make-variable injection to be wired into the drivers.
        required: true
        default: release-v1
        type: choice
        options:
          - release-v1
          - debug-v1
          - release-o3-v1
  workflow_call:
    inputs:
      core_id:
        required: true
        type: string
      chipset:
        required: true
        type: string
      track_tag:
        required: true
        type: string
      optimization_profile:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CORE_ID: ${{ inputs.core_id }}
      GROUP_TAG: ${{ inputs.track_tag }}:${{ inputs.chipset }}
      OPTIMIZATION_PROFILE: ${{ inputs.optimization_profile }}
      RUN_ID: actions-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Check clean tracked state
        run: test -z "$(git status --short)"

      # Resolve the group before any toolchain download, so an unbuildable
      # core/chipset pair fails in seconds rather than after ~500MB of images.
      - name: Resolve the core-track group for this chipset
        run: >-
          python3 scripts/core_pipeline.py core-track-inventory
          --group-tag "$GROUP_TAG"
          --core "$CORE_ID"

      - name: Download Docker image archives outside the repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/core-toolchains"
          gh release download toolchains \
            --pattern "cores-arm64.tar.gz" \
            --dir "$RUNNER_TEMP/core-toolchains"
          gh release download toolchains \
            --pattern "cores-armhf.tar.gz" \
            --dir "$RUNNER_TEMP/core-toolchains"
          gh release download toolchains \
            --pattern "cores-rust.tar.gz" \
            --dir "$RUNNER_TEMP/core-toolchains"

      - name: Verify Docker image archives
        run: >-
          python3 scripts/toolchain_archive.py verify-downloads
          --lock pins/toolchains/local-cache-v1.json
          --arm64 "$RUNNER_TEMP/core-toolchains/cores-arm64.tar.gz"
          --armhf "$RUNNER_TEMP/core-toolchains/cores-armhf.tar.gz"
          --rust "$RUNNER_TEMP/core-toolchains/cores-rust.tar.gz"

      - name: Load Docker images
        run: |
          gunzip -c "$RUNNER_TEMP/core-toolchains/cores-arm64.tar.gz" | docker load
          gunzip -c "$RUNNER_TEMP/core-toolchains/cores-armhf.tar.gz" | docker load
          gunzip -c "$RUNNER_TEMP/core-toolchains/cores-rust.tar.gz" | docker load

      - name: Run publication-disabled variant build
        run: >-
          python3 scripts/core_pipeline.py build-core
          --runner-profile github-actions
          --core "$CORE_ID"
          --group-tag "$GROUP_TAG"
          --optimization-profile "$OPTIMIZATION_PROFILE"
          --run-id "$RUN_ID"

      - name: Upload E2E diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: variant-e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.core_id }}-${{ inputs.chipset }}-${{ inputs.optimization_profile }}
          path: .local-e2e/runs/${{ env.RUN_ID }}/
          if-no-files-found: ignore
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
