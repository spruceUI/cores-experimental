name: Cross product

# Every core x every board at max optimization. Boards with identical flags
# share one build. Debug builds are per-core experiments in build.yml.

on:
  workflow_dispatch:
    inputs:
      cores:
        description: Core ids, space or comma separated, or "all"
        default: all
        type: string
      bundle:
        description: Assemble device bundles per board
        default: true
        type: boolean
      runtime:
        description: C++ runtime linked shared (needs the device's libstdc++), static, or both
        default: shared
        type: choice
        options: [shared, static, "shared,static"]
      strip:
        description: Strip symbols and debug info (what ships); load-tested after stripping
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  cores:
    uses: ./.github/workflows/_cores.yml
    with:
      cores: ${{ inputs.cores }}
      boards: all
      profiles: max
      bundle: ${{ inputs.bundle }}
      runtime: ${{ inputs.runtime }}
      strip: ${{ inputs.strip }}
