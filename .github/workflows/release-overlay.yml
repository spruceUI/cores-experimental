name: Convert sealed candidate to file overlay

on:
  workflow_dispatch:
    inputs:
      coordinator_run_id:
        description: >-
          Run ID of a successful "Build release candidate" run;
          empty selects the latest successful run
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COORDINATOR_WORKFLOW: release-candidate.yml
      CANDIDATE_INPUT_ROOT: .local-e2e/overlay-input
      OVERLAY_OUTPUT_ROOT: .local-e2e/overlays
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Resolve coordinator run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.coordinator_run_id }}
        run: |
          if [ -n "$REQUESTED_RUN_ID" ]; then
            run_id="$REQUESTED_RUN_ID"
          else
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$COORDINATOR_WORKFLOW" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
          fi
          if [ -z "$run_id" ]; then
            echo "no successful release-candidate run found" >&2
            exit 1
          fi
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Download sealed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-candidate-*
          run-id: ${{ steps.run.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.CANDIDATE_INPUT_ROOT }}
          merge-multiple: false

      - name: Convert to file overlay
        id: convert
        run: |
          candidate_dir="$(find "$CANDIDATE_INPUT_ROOT" -mindepth 1 -maxdepth 1 \
            -type d -name 'release-candidate-*' | sort | tail -n 1)"
          if [ -z "$candidate_dir" ]; then
            echo "no release-candidate artifact downloaded" >&2
            exit 1
          fi
          output_dir="$OVERLAY_OUTPUT_ROOT/$(basename "$candidate_dir")"
          python3 scripts/release_overlay.py \
            --candidate-dir "$candidate_dir" \
            --output-dir "$output_dir"
          printf 'output_dir=%s\n' "$output_dir" >> "$GITHUB_OUTPUT"

      - name: Upload file overlay
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-overlay-${{ steps.run.outputs.run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.convert.outputs.output_dir }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
